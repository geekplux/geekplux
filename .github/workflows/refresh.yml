name: Refresh profile figures

on:
  schedule:
    - cron: "17 9 * * 1" # Mondays
  workflow_dispatch:
  push:
    branches: [master]
    paths: [scripts/**, fonts/**]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: node scripts/render.mjs
      - name: Commit if anything changed
        run: |
          git add -A README.md assets data
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Refresh profile figures"
          git push
